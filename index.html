<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <!-- Faz o site se ajustar à tela do celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!-- Texto que aparece na aba do navegador -->
    <title>Reservas do laboratório de informática</title>

    <!-- FONTES: carrega as letras do Google Fonts.
         Para trocar a fonte, mude os nomes aqui E no style.css (procure "font-family") -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- Liga este HTML ao arquivo de visual (cores, tamanhos, etc.) -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= TOPO DO SITE (faixa azul escura) ================= -->
    <header>
        <!-- Ícone + nome do laboratório. Para mudar o nome, edite o texto dentro do <h1> -->
        <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true">
                <rect x="2" y="4" width="28" height="19" rx="4" fill="#c3e2f6" />
                <rect x="6" y="8" width="9" height="4" rx="1.5" fill="#0f3554" />
                <rect x="6" y="14" width="14" height="4" rx="1.5" fill="#d9a000" />
                <rect x="11" y="25" width="10" height="3" rx="1.5" fill="#c3e2f6" />
            </svg>
            <h1>Laboratório de informática</h1>
        </div>

        <!-- Área do usuário (só aparece depois do login) -->
        <div id="quem" hidden>
            <span class="avatar" id="avatar" aria-hidden="true"></span> <!-- círculo com a inicial do nome -->
            <span id="nome"></span> <!-- nome do professor -->
            <span class="badge" id="selo" hidden>Administrador</span> <!-- só aparece para administradores -->
            <button id="sair" type="button">Sair</button>
        </div>
    </header>

    <!-- ================= TELA DE ENTRADA (login e criar conta) ================= -->
    <div class="wrap" id="entrada" hidden>
        <section class="panel entrada">
            <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true">
                    <rect x="2" y="4" width="28" height="19" rx="4" fill="#c3e2f6" />
                    <rect x="6" y="8" width="9" height="4" rx="1.5" fill="#0f3554" />
                    <rect x="6" y="14" width="14" height="4" rx="1.5" fill="#d9a000" />
                    <rect x="11" y="25" width="10" height="3" rx="1.5" fill="#c3e2f6" />
                </svg></div>

            <!-- Faixinha decorativa com as cores da agenda (as 4 barras são só enfeite) -->
            <div class="mini" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

            <!-- Título e subtítulo: o JavaScript troca esses textos entre "Entrar" e "Criar conta" -->
            <h2 id="ltitulo">Entrar</h2>
            <p class="sub" id="lsub">Use seu e-mail e senha para reservar o laboratório.</p>

            <form id="lf">
                <!-- Campo de nome: só aparece quando está em "Criar conta" -->
                <label id="lnomeBox" hidden>Seu nome
                    <input type="text" id="lnome" maxlength="40" autocomplete="name">
                </label>
                <label>E-mail
                    <input type="email" id="lemail" required autocomplete="email">
                </label>
                <label>Senha
                    <!-- minlength="6" = a senha precisa ter pelo menos 6 caracteres -->
                    <input type="password" id="lsenha" required minlength="6" autocomplete="current-password">
                </label>
                <button class="go" type="submit" id="lbotao">Entrar</button>
                <!-- Aqui aparecem mensagens de erro ou sucesso do login -->
                <p id="lmsg" role="status"></p>
            </form>

            <!-- Botão que alterna entre "Entrar" e "Criar conta" -->
            <button class="troca" type="button" id="troca">Não tem conta? Criar conta</button>
        </section>
    </div>

    <!-- ================= TELA PRINCIPAL (agenda) — só aparece depois do login ================= -->
    <div class="wrap" id="app" hidden>

        <!-- Nome do mês (preenchido pelo JavaScript) -->
        <p class="month" id="mes"></p>

        <!-- Botões dos dias da semana (criados pelo JavaScript) -->
        <div class="week" id="week"></div>

        <div class="cols">
            <!-- Coluna da esquerda: agenda do dia escolhido -->
            <section class="panel">
                <h2 id="dlabel"></h2> <!-- ex.: "sexta-feira, 23 de outubro" -->
                <p class="sub" id="dsub"></p> <!-- ex.: "2 reservas neste dia" -->
                <div class="tl" id="tl" aria-label="Horários do dia"></div> <!-- linha do tempo -->
            </section>

            <!-- Coluna da direita: formulário de nova reserva -->
            <aside class="panel">
                <h2>Nova reserva</h2>
                <p class="sub">Toque num horário livre da agenda ou preencha abaixo.</p>
                <form id="f">
                    <div class="row">
                        <label>Início<input type="time" id="ini" required></label>
                        <label>Fim<input type="time" id="fim" required></label>
                    </div>
                    <!-- placeholder = o texto de exemplo que aparece apagadinho no campo -->
                    <label>Turma / atividade<input type="text" id="turma" placeholder="Ex.: 2º ano, Informática"
                            maxlength="60"></label>
                    <button class="go" type="submit">Reservar horário</button>
                    <!-- Mensagens de erro ou sucesso da reserva aparecem aqui -->
                    <p id="msg" role="status"></p>
                </form>
            </aside>
        </div>

        <!-- Frase pequena no rodapé -->
        <p class="note">O sistema não deixa duas reservas ocuparem o mesmo horário.</p>
    </div>

    <!-- Biblioteca do Supabase (banco de dados e login). Não remova -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>

    <!-- ================= JAVASCRIPT (a "inteligência" do site) ================= -->
    <script>
        /* ---------- CONFIGURAÇÕES QUE VOCÊ PODE MUDAR ---------- */
        // START e END = horário que a agenda mostra, contado em MINUTOS desde a meia-noite.
        // 420 = 7h00 | 780 = 13h00. Exemplos: 6h = 360, 18h = 1080.
        // PX = quantos pixels vale cada minuto (1.5 = 90 px por hora).
        // IMPORTANTE: se mudar o PX, mude também o "90px" das faixas no style.css (.tl)
        var START = 420, END = 780, PX = 1.5;

        // Dados de conexão com o Supabase (não mude, senão o site perde a conexão)
        var SUPABASE_URL = "https://vfzqbafhnbnpcehsmxom.supabase.co";
        var SUPABASE_KEY = "sb_publishable_FP6FDTWUGgeUQWmqQvmOtA_i1JHDyjl";
        var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* ---------- FUNÇÕES AUXILIARES (pequenas ferramentas usadas no resto do código) ---------- */
        function mins(t) { var x = t.split(":"); return +x[0] * 60 + +x[1] }   // "09:30" vira 570 minutos
        function hhmm(m) { return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0") } // 570 vira "09:30"
        function toDate(s) { var x = s.split("-"); return new Date(+x[0], +x[1] - 1, +x[2]) } // "2026-10-23" vira data
        function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") } // data vira "2026-10-23"
        function addDays(s, n) { var d = toDate(s); d.setDate(d.getDate() + n); return iso(d) } // soma dias a uma data
        function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e } // cria um elemento HTML

        // Abre no dia de hoje; sábado e domingo caem na próxima segunda
        function hoje() {
            var d = new Date(), w = d.getDay();
            if (w === 6) d.setDate(d.getDate() + 2);
            if (w === 0) d.setDate(d.getDate() + 1);
            return iso(d);
        }

        // Variáveis principais:
        // R = lista de reservas | cur = dia que está aberto na tela
        // pick = horário que o professor tocou na agenda | me = usuário logado | isAdmin = é administrador?
        var R = [], cur = hoje(), pick = null, me = null, isAdmin = false;

        // Mensagens: say() escreve na área de reservas, lsay() na área de login
        var msg = document.getElementById("msg"), lmsg = document.getElementById("lmsg");
        function say(t, c) { msg.textContent = t; msg.className = c || "" }   // c = "err" (vermelho) ou "ok" (verde)
        function lsay(t, c) { lmsg.textContent = t; lmsg.className = c || "" }
        // Nome a mostrar: o nome cadastrado ou, se não tiver, o e-mail
        function nomeDe(u) { return (u.user_metadata && u.user_metadata.nome) || u.email }

        /* ---------- LOGIN ---------- */
        var modo = "entrar"; // "entrar" ou "criar"

        // Troca a tela de login entre "Entrar" e "Criar conta" (textos e campo de nome)
        function setModo(m) {
            modo = m;
            var criar = m === "criar";
            document.getElementById("ltitulo").textContent = criar ? "Criar conta" : "Entrar";
            document.getElementById("lsub").textContent = criar
                ? "Cadastre-se para poder reservar o laboratório."
                : "Use seu e-mail e senha para reservar o laboratório.";
            document.getElementById("lnomeBox").hidden = !criar;
            document.getElementById("lnome").required = criar;
            document.getElementById("lsenha").autocomplete = criar ? "new-password" : "current-password";
            document.getElementById("lbotao").textContent = criar ? "Criar conta" : "Entrar";
            document.getElementById("troca").textContent = criar ? "Já tem conta? Entrar" : "Não tem conta? Criar conta";
            lsay("");
        }

        // Decide o que aparece: tela de login (se ninguém logou) ou a agenda (se logou)
        function atualizarTela() {
            document.getElementById("entrada").hidden = !!me;
            document.getElementById("app").hidden = !me;
            document.getElementById("quem").hidden = !me;
            if (me) {
                document.getElementById("nome").textContent = nomeDe(me);
                document.getElementById("avatar").textContent = nomeDe(me).trim().charAt(0); // inicial do nome
                document.getElementById("selo").hidden = !isAdmin; // mostra o selo só para administrador
            }
        }

        // Confere no banco se o usuário está na tabela "admins"
        async function verificarAdmin() {
            var r = await db.from("admins").select("user_id").eq("user_id", me.id).maybeSingle();
            isAdmin = !!r.data;
        }

        // Roda logo depois do login: verifica admin, atualiza a tela e carrega as reservas
        async function iniciar() {
            await verificarAdmin();
            atualizarTela();
            carregar();
        }

        // Dispara toda vez que alguém entra ou sai da conta
        db.auth.onAuthStateChange(function (evento, sessao) {
            me = sessao ? sessao.user : null;
            atualizarTela();
            if (me) { setTimeout(iniciar, 0) } else { R = []; isAdmin = false; setModo("entrar") }
        });

        // Clique em "Não tem conta? Criar conta" / "Já tem conta? Entrar"
        document.getElementById("troca").addEventListener("click", function () {
            setModo(modo === "entrar" ? "criar" : "entrar");
        });

        // Envio do formulário de login / criação de conta
        document.getElementById("lf").addEventListener("submit", async function (e) {
            e.preventDefault();
            var email = document.getElementById("lemail").value.trim();
            var senha = document.getElementById("lsenha").value;

            // Se estiver criando conta:
            if (modo === "criar") {
                var nome = document.getElementById("lnome").value.trim();
                if (!nome) { lsay("Preencha o seu nome.", "err"); return }
                var cad = await db.auth.signUp({ email: email, password: senha, options: { data: { nome: nome } } });
                // O cadastro falhou. Pode ser alguém tentando criar a conta de novo sem ter confirmado o e-mail.
                // Para descobrir, tentamos entrar com os mesmos dados: se o Supabase disser que o e-mail
                // não foi confirmado, mostramos a mensagem certa. Se for outro motivo, o erro real aparece.
                if (cad.error) {
                    var tenta = await db.auth.signInWithPassword({ email: email, password: senha });
                    var motivo = ((tenta.error && tenta.error.message) || "").toLowerCase();
                    if (motivo.indexOf("confirm") >= 0) {
                        lsay("Você precisa confirmar o e-mail. Procure a mensagem na sua caixa de entrada (e no spam).", "err");
                        return;
                    }
                    lsay("Não foi possível criar a conta: " + cad.error.message, "err");
                    return;
                }
                // Quando o e-mail já tem conta, o Supabase não dá erro: devolve um usuário sem "identities".
                if (cad.data.user && cad.data.user.identities && cad.data.user.identities.length === 0) {
                    lsay("Este e-mail já tem conta. Toque em \"Já tem conta? Entrar\".", "err");
                    return;
                }
                if (cad.data.session) {
                    say("Conta criada com sucesso! Bem-vindo(a), " + nome + ".", "ok");
                } else {
                    lsay("Conta criada! Enviamos um e-mail para você confirmar antes de entrar.", "ok");
                }
                return;
            }

            // Se estiver entrando:
            var res = await db.auth.signInWithPassword({ email: email, password: senha });
            if (res.error) {
                var m = (res.error.message || "").toLowerCase();
                lsay(m.indexOf("confirm") >= 0 ? "Você precisa confirmar o e-mail. Procure a mensagem na sua caixa de entrada (e no spam)." : "E-mail ou senha incorretos. Se ainda não tem conta, toque em \"Criar conta\".", "err");
                return;
            }
            lsay("");
        });

        // Botão "Sair"
        document.getElementById("sair").addEventListener("click", function () { db.auth.signOut() });

        /* ---------- RESERVAS ---------- */

        // Busca todas as reservas no banco e desenha a tela
        async function carregar() {
            var res = await db.from("reservas").select("*").order("inicio");
            if (res.error) { say("Erro ao carregar: " + res.error.message, "err"); return }
            // Guarda em R só o que precisamos: id, dono (u), data (d), professor (p), início (a), fim (b), turma (t)
            R = res.data.map(function (r) {
                return { id: r.id, u: r.user_id, d: r.data, p: r.professor, a: r.inicio.slice(0, 5), b: r.fim.slice(0, 5), t: r.turma || "" };
            });
            render();
        }

        // Desenha a faixa da semana (setas + 5 dias de segunda a sexta)
        function renderWeek() {
            var w = document.getElementById("week"); w.textContent = "";
            // mon = segunda-feira da semana atual | hj = data de hoje
            var d = toDate(cur), mon = addDays(cur, -((d.getDay() + 6) % 7)), hj = iso(new Date());
            // Nome do mês e ano acima da semana
            document.getElementById("mes").textContent = d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

            // Seta "semana anterior"
            var prev = el("button", "nav", "‹"); prev.setAttribute("aria-label", "Semana anterior");
            prev.onclick = function () { cur = addDays(cur, -7); pick = null; render() }; w.appendChild(prev);

            // Os 5 botões de dias (i = 0 é segunda, 4 é sexta). Para incluir sábado, troque "5" por "6"
            for (var i = 0; i < 5; i++) {
                var s = addDays(mon, i), dd = toDate(s), n = R.filter(function (r) { return r.d === s }).length; // n = quantas reservas no dia
                // Classes do botão: "on" = dia aberto | "today" = hoje (azul) | "past" = já passou (apagado)
                var b = el("button", "d" + (s === cur ? " on" : "") + (s === hj ? " today" : "") + (s < hj ? " past" : ""));
                if (s === hj) b.setAttribute("aria-current", "date");
                // Texto de cima: "sex 23"
                b.appendChild(el("b", null, dd.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "") + " " + dd.getDate()));
                // Texto de baixo: "livre" (verde) ou "2 reservas"
                b.appendChild(el("span", n ? null : "free", n ? n + (n > 1 ? " reservas" : " reserva") : "livre"));
                b.onclick = (function (x) { return function () { cur = x; pick = null; render() } })(s);
                w.appendChild(b);
            }

            // Seta "próxima semana"
            var nx = el("button", "nav", "›"); nx.setAttribute("aria-label", "Próxima semana");
            nx.onclick = function () { cur = addDays(cur, 7); pick = null; render() }; w.appendChild(nx);
        }

        // Desenha a agenda do dia escolhido (linhas de hora + blocos das reservas)
        function renderDay() {
            var d = toDate(cur);
            // Título do painel, ex.: "sexta-feira, 23 de outubro"
            document.getElementById("dlabel").textContent = d.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
            // Reservas só deste dia, em ordem de horário
            var list = R.filter(function (r) { return r.d === cur }).sort(function (a, b) { return mins(a.a) - mins(b.a) });
            document.getElementById("dsub").textContent = list.length ? list.length + (list.length > 1 ? " reservas neste dia" : " reserva neste dia") : "Nenhuma reserva: o laboratório está livre.";

            // Limpa a linha do tempo e define a altura total (minutos x PX)
            var tl = document.getElementById("tl"); tl.textContent = ""; tl.style.height = (END - START) * PX + "px";

            // Linhas de cada hora com o rótulo (07:00, 08:00...)
            for (var m = START; m <= END; m += 60) { var h = el("div", "hr"); h.style.top = (m - START) * PX + "px"; h.appendChild(el("i", null, hhmm(m))); tl.appendChild(h) }

            // Um bloco para cada reserva
            list.forEach(function (r) {
                var top = (mins(r.a) - START) * PX, ht = (mins(r.b) - mins(r.a)) * PX; // posição e altura do bloco
                var mine = !!me && r.u === me.id, b = el("div", "blk " + (mine ? "mine" : "other")); // "mine" = minha reserva (amarelo)
                b.style.top = top + "px"; b.style.height = ht - 2 + "px";
                b.appendChild(el("b", null, r.p)); // nome do professor
                b.appendChild(el("small", null, r.a + "–" + r.b + (r.t ? " · " + r.t : ""))); // horário e turma

                // Botão "Cancelar": aparece só para o dono da reserva ou para o administrador
                if (mine || isAdmin) {
                    var c = el("button", null, "Cancelar");
                    c.onclick = async function () {
                        // Administrador cancelando reserva de outra pessoa: pede confirmação
                        if (!mine && !confirm("Cancelar a reserva de " + r.p + "?")) return;
                        var res = await db.from("reservas").delete().eq("id", r.id).select();
                        if (res.error || !res.data || !res.data.length) { say("Não foi possível cancelar.", "err"); return }
                        say("Reserva cancelada.", "ok"); carregar();
                    };
                    b.appendChild(c);
                }
                tl.appendChild(b);
            });

            // Linha vermelha do horário atual (só no dia de hoje e dentro do horário da agenda)
            var agora = new Date(), am = agora.getHours() * 60 + agora.getMinutes();
            if (cur === iso(agora) && am >= START && am <= END) { var nl = el("div", "now"); nl.style.top = (am - START) * PX + "px"; tl.appendChild(nl) }

            // Retângulo tracejado do horário que o professor tocou na agenda
            if (pick) { var s = el("div", "sel"); s.style.top = (mins(pick[0]) - START) * PX + "px"; s.style.height = (mins(pick[1]) - mins(pick[0])) * PX + "px"; tl.appendChild(s) }
        }

        // Redesenha tudo (semana + dia)
        function render() { renderWeek(); renderDay() }

        // Clique num espaço livre da agenda: preenche início e fim no formulário
        document.getElementById("tl").addEventListener("click", function (e) {
            if (e.target.closest(".blk")) return; // clicou numa reserva existente: ignora
            // Converte onde você clicou em um horário, arredondando de 10 em 10 minutos
            var y = e.clientY - this.getBoundingClientRect().top, m = Math.round((START + y / PX) / 10) * 10;
            // Duração padrão da reserva: 50 minutos (para mudar, troque os dois "50")
            m = Math.max(START, Math.min(END - 50, m));
            document.getElementById("ini").value = hhmm(m); document.getElementById("fim").value = hhmm(m + 50);
            pick = [hhmm(m), hhmm(m + 50)]; say(""); renderDay();
        });

        // Envio do formulário "Nova reserva"
        document.getElementById("f").addEventListener("submit", async function (e) {
            e.preventDefault();
            if (!me) return;
            var form = this;
            var a = document.getElementById("ini").value, b = document.getElementById("fim").value; // a = início, b = fim

            // Validações antes de salvar:
            if (!a || !b) { say("Informe o início e o fim.", "err"); return }
            if (mins(b) <= mins(a)) { say("O fim precisa ser depois do início.", "err"); return }

            // Confere se o horário bate com alguma reserva do mesmo dia
            var hit = R.filter(function (r) { return r.d === cur && mins(a) < mins(r.b) && mins(r.a) < mins(b) })[0];
            if (hit) { say("Horário indisponível: " + hit.p + " já reservou das " + hit.a + " às " + hit.b + ".", "err"); return }

            // Salva no banco
            var res = await db.from("reservas").insert({
                professor: nomeDe(me), data: cur, inicio: a, fim: b,
                turma: document.getElementById("turma").value.trim()
            });

            // O banco também bloqueia conflitos 
            if (res.error) {
                if (res.error.code === "23P01") { say("Horário indisponível: já existe uma reserva nesse horário.", "err") }
                else { say("Erro ao salvar: " + res.error.message, "err") }
                return;
            }
            pick = null; form.reset(); say("Reserva feita para " + a + "–" + b + ".", "ok"); carregar();
        });
    </script>
</body>

</html>

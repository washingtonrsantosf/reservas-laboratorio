<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Reservas do laboratório de informática</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Laboratório de informática</h1>
        <div id="quem" hidden>
            <span id="nome"></span>
            <button id="sair" type="button">Sair</button>
        </div>
    </header>

    <div class="wrap" id="entrada" hidden>
        <section class="panel entrada">
            <h2 id="ltitulo">Entrar</h2>
            <p class="sub" id="lsub">Use seu e-mail e senha para reservar o laboratório.</p>
            <form id="lf">
                <label id="lnomeBox" hidden>Seu nome
                    <input type="text" id="lnome" maxlength="40" autocomplete="name">
                </label>
                <label>E-mail
                    <input type="email" id="lemail" required autocomplete="email">
                </label>
                <label>Senha
                    <input type="password" id="lsenha" required minlength="6" autocomplete="current-password">
                </label>
                <button class="go" type="submit" id="lbotao">Entrar</button>
                <p id="lmsg" role="status"></p>
            </form>
            <button class="troca" type="button" id="troca">Não tem conta? Criar conta</button>
        </section>
    </div>

    <div class="wrap" id="app" hidden>
        <div class="week" id="week"></div>
        <div class="cols">
            <section class="panel">
                <h2 id="dlabel"></h2>
                <p class="sub" id="dsub"></p>
                <div class="tl" id="tl" aria-label="Horários do dia"></div>
            </section>
            <aside class="panel">
                <h2>Nova reserva</h2>
                <p class="sub">Toque num horário livre da agenda ou preencha abaixo.</p>
                <form id="f">
                    <div class="row">
                        <label>Início<input type="time" id="ini" required></label>
                        <label>Fim<input type="time" id="fim" required></label>
                    </div>
                    <label>Turma / atividade<input type="text" id="turma" placeholder="Ex.: 2º ano, Informática"
                            maxlength="60"></label>
                    <button class="go" type="submit">Reservar horário</button>
                    <p id="msg" role="status"></p>
                </form>
            </aside>
        </div>
        <p class="note">As reservas ficam salvas no banco de dados, e o bloqueio de conflito é feito por ele.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
    <script>
        var START = 420, END = 780, PX = 1.5;
        var SUPABASE_URL = "https://vfzqbafhnbnpcehsmxom.supabase.co";
        var SUPABASE_KEY = "sb_publishable_FP6FDTWUGgeUQWmqQvmOtA_i1JHDyjl";
        var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function mins(t) { var x = t.split(":"); return +x[0] * 60 + +x[1] }
        function hhmm(m) { return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0") }
        function toDate(s) { var x = s.split("-"); return new Date(+x[0], +x[1] - 1, +x[2]) }
        function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") }
        function addDays(s, n) { var d = toDate(s); d.setDate(d.getDate() + n); return iso(d) }
        function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e }

        // Abre no dia de hoje; sábado e domingo caem na próxima segunda
        function hoje() {
            var d = new Date(), w = d.getDay();
            if (w === 6) d.setDate(d.getDate() + 2);
            if (w === 0) d.setDate(d.getDate() + 1);
            return iso(d);
        }

        var R = [], cur = hoje(), pick = null, me = null, isAdmin = false;

        var msg = document.getElementById("msg"), lmsg = document.getElementById("lmsg");
        function say(t, c) { msg.textContent = t; msg.className = c || "" }
        function lsay(t, c) { lmsg.textContent = t; lmsg.className = c || "" }
        function nomeDe(u) { return (u.user_metadata && u.user_metadata.nome) || u.email }

        /* ---------- login ---------- */
        var modo = "entrar";

        function setModo(m) {
            modo = m;
            var criar = m === "criar";
            document.getElementById("ltitulo").textContent = criar ? "Criar conta" : "Entrar";
            document.getElementById("lsub").textContent = criar
                ? "Cadastre-se para poder reservar o laboratório."
                : "Use seu e-mail e senha para reservar o laboratório.";
            document.getElementById("lnomeBox").hidden = !criar;
            document.getElementById("lnome").required = criar;
            document.getElementById("lsenha").autocomplete = criar ? "new-password" : "current-password";
            document.getElementById("lbotao").textContent = criar ? "Criar conta" : "Entrar";
            document.getElementById("troca").textContent = criar ? "Já tem conta? Entrar" : "Não tem conta? Criar conta";
            lsay("");
        }

        function atualizarTela() {
            document.getElementById("entrada").hidden = !!me;
            document.getElementById("app").hidden = !me;
            document.getElementById("quem").hidden = !me;
            if (me) document.getElementById("nome").textContent = nomeDe(me) + (isAdmin ? " · administrador" : "");
        }

        async function verificarAdmin() {
            var r = await db.from("admins").select("user_id").eq("user_id", me.id).maybeSingle();
            isAdmin = !!r.data;
        }

        async function iniciar() {
            await verificarAdmin();
            atualizarTela();
            carregar();
        }

        db.auth.onAuthStateChange(function (evento, sessao) {
            me = sessao ? sessao.user : null;
            atualizarTela();
            if (me) { setTimeout(iniciar, 0) } else { R = []; isAdmin = false; setModo("entrar") }
        });

        document.getElementById("troca").addEventListener("click", function () {
            setModo(modo === "entrar" ? "criar" : "entrar");
        });

        document.getElementById("lf").addEventListener("submit", async function (e) {
            e.preventDefault();
            var email = document.getElementById("lemail").value.trim();
            var senha = document.getElementById("lsenha").value;

            if (modo === "criar") {
                var nome = document.getElementById("lnome").value.trim();
                if (!nome) { lsay("Preencha o seu nome.", "err"); return }
                var cad = await db.auth.signUp({ email: email, password: senha, options: { data: { nome: nome } } });
                if (cad.error) { lsay("Não foi possível criar a conta: " + cad.error.message, "err"); return }
                if (cad.data.session) {
                    say("Conta criada com sucesso! Bem-vindo(a), " + nome + ".", "ok");
                } else {
                    lsay("Conta criada! Enviamos um e-mail para você confirmar antes de entrar.", "ok");
                }
                return;
            }

            var res = await db.auth.signInWithPassword({ email: email, password: senha });
            if (res.error) {
                var m = (res.error.message || "").toLowerCase();
                lsay(m.indexOf("confirm") >= 0 ? "Confirme seu e-mail antes de entrar." : "E-mail ou senha incorretos. Se ainda não tem conta, toque em \"Criar conta\".", "err");
                return;
            }
            lsay("");
        });

        document.getElementById("sair").addEventListener("click", function () { db.auth.signOut() });

        /* ---------- reservas ---------- */
        async function carregar() {
            var res = await db.from("reservas").select("*").order("inicio");
            if (res.error) { say("Erro ao carregar: " + res.error.message, "err"); return }
            R = res.data.map(function (r) {
                return { id: r.id, u: r.user_id, d: r.data, p: r.professor, a: r.inicio.slice(0, 5), b: r.fim.slice(0, 5), t: r.turma || "" };
            });
            render();
        }

        function renderWeek() {
            var w = document.getElementById("week"); w.textContent = "";
            var d = toDate(cur), mon = addDays(cur, -((d.getDay() + 6) % 7));
            var prev = el("button", "nav", "‹"); prev.setAttribute("aria-label", "Semana anterior");
            prev.onclick = function () { cur = addDays(cur, -7); pick = null; render() }; w.appendChild(prev);
            for (var i = 0; i < 5; i++) {
                var s = addDays(mon, i), dd = toDate(s), n = R.filter(function (r) { return r.d === s }).length;
                var b = el("button", "d" + (s === cur ? " on" : ""));
                b.appendChild(el("b", null, dd.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "") + " " + dd.getDate()));
                b.appendChild(el("span", null, n ? n + (n > 1 ? " reservas" : " reserva") : "livre"));
                b.onclick = (function (x) { return function () { cur = x; pick = null; render() } })(s);
                w.appendChild(b);
            }
            var nx = el("button", "nav", "›"); nx.setAttribute("aria-label", "Próxima semana");
            nx.onclick = function () { cur = addDays(cur, 7); pick = null; render() }; w.appendChild(nx);
        }

        function renderDay() {
            var d = toDate(cur);
            document.getElementById("dlabel").textContent = d.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
            var list = R.filter(function (r) { return r.d === cur }).sort(function (a, b) { return mins(a.a) - mins(b.a) });
            document.getElementById("dsub").textContent = list.length ? list.length + (list.length > 1 ? " reservas neste dia" : " reserva neste dia") : "Nenhuma reserva: o laboratório está livre.";
            var tl = document.getElementById("tl"); tl.textContent = ""; tl.style.height = (END - START) * PX + "px";
            for (var m = START; m <= END; m += 60) { var h = el("div", "hr"); h.style.top = (m - START) * PX + "px"; h.appendChild(el("i", null, hhmm(m))); tl.appendChild(h) }
            list.forEach(function (r) {
                var top = (mins(r.a) - START) * PX, ht = (mins(r.b) - mins(r.a)) * PX;
                var mine = !!me && r.u === me.id, b = el("div", "blk " + (mine ? "mine" : "other"));
                b.style.top = top + "px"; b.style.height = ht - 2 + "px";
                b.appendChild(el("b", null, r.p));
                b.appendChild(el("small", null, r.a + "–" + r.b + (r.t ? " · " + r.t : "")));
                if (mine || isAdmin) {
                    var c = el("button", null, "Cancelar");
                    c.onclick = async function () {
                        if (!mine && !confirm("Cancelar a reserva de " + r.p + "?")) return;
                        var res = await db.from("reservas").delete().eq("id", r.id).select();
                        if (res.error || !res.data || !res.data.length) { say("Não foi possível cancelar.", "err"); return }
                        say("Reserva cancelada.", "ok"); carregar();
                    };
                    b.appendChild(c);
                }
                tl.appendChild(b);
            });
            if (pick) { var s = el("div", "sel"); s.style.top = (mins(pick[0]) - START) * PX + "px"; s.style.height = (mins(pick[1]) - mins(pick[0])) * PX + "px"; tl.appendChild(s) }
        }

        function render() { renderWeek(); renderDay() }

        document.getElementById("tl").addEventListener("click", function (e) {
            if (e.target.closest(".blk")) return;
            var y = e.clientY - this.getBoundingClientRect().top, m = Math.round((START + y / PX) / 10) * 10;
            m = Math.max(START, Math.min(END - 50, m));
            document.getElementById("ini").value = hhmm(m); document.getElementById("fim").value = hhmm(m + 50);
            pick = [hhmm(m), hhmm(m + 50)]; say(""); renderDay();
        });

        document.getElementById("f").addEventListener("submit", async function (e) {
            e.preventDefault();
            if (!me) return;
            var form = this;
            var a = document.getElementById("ini").value, b = document.getElementById("fim").value;
            if (!a || !b) { say("Informe o início e o fim.", "err"); return }
            if (mins(b) <= mins(a)) { say("O fim precisa ser depois do início.", "err"); return }
            var hit = R.filter(function (r) { return r.d === cur && mins(a) < mins(r.b) && mins(r.a) < mins(b) })[0];
            if (hit) { say("Horário indisponível: " + hit.p + " já reservou das " + hit.a + " às " + hit.b + ".", "err"); return }
            var res = await db.from("reservas").insert({
                professor: nomeDe(me), data: cur, inicio: a, fim: b,
                turma: document.getElementById("turma").value.trim()
            });
            if (res.error) {
                if (res.error.code === "23P01") { say("Horário indisponível: já existe uma reserva nesse horário.", "err") }
                else { say("Erro ao salvar: " + res.error.message, "err") }
                return;
            }
            pick = null; form.reset(); say("Reserva feita para " + a + "–" + b + ".", "ok"); carregar();
        });
    </script>
</body>

</html>
